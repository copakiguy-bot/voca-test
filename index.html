<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전우 보카 테스트 — 2027 심슨 보카</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --army:#3e4a2e; --army-dark:#2c351f; --army-light:#5a6b44;
    --khaki:#c9c19a; --paper:#f4f2e8; --ink:#22261a;
    --ok:#2e7d32; --bad:#c62828; --accent:#8a6d1f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:linear-gradient(160deg,#2c351f 0%,#3e4a2e 55%,#4a573a 100%);
    min-height:100vh; padding:24px 12px; color:var(--ink);
  }
  .wrap{display:flex; align-items:flex-start; justify-content:center; position:relative; max-width:820px; margin:0 auto;}
  .card{
    width:100%; max-width:560px; background:var(--paper);
    border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.45);
    overflow:hidden; position:relative; z-index:2;
  }
  .mascot{
    width:200px; margin-left:-24px; margin-top:52px; z-index:1;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media (max-width:830px){
    .mascot{position:absolute; width:64px; top:6px; right:4px; margin:0; z-index:5;}
  }
  header{
    background:var(--army-dark); color:var(--khaki);
    padding:20px 24px; text-align:center;
  }
  header h1{font-size:1.45rem; letter-spacing:2px;}
  header p{font-size:.8rem; opacity:.75; margin-top:4px; letter-spacing:1px;}
  .body{padding:24px;}
  .label{font-weight:700; font-size:.9rem; margin:18px 0 8px; color:var(--army-dark); letter-spacing:1px;}
  .label:first-child{margin-top:0;}
  .dayselect{
    width:100%; padding:13px 14px; font-size:1rem; font-weight:700;
    border:2px solid var(--army-light); border-radius:10px; background:#fff;
    color:var(--army-dark); font-family:inherit; outline:none; cursor:pointer;
  }
  .dayselect:focus{border-color:var(--accent);}
  .optgrid{display:grid; gap:8px;}
  .optgrid.cols3{grid-template-columns:repeat(3,1fr);}
  .selbtn{
    border:2px solid var(--army-light); background:#fff; border-radius:10px;
    padding:12px 10px; font-size:.92rem; cursor:pointer; font-weight:600;
    color:var(--army-dark); transition:.15s; text-align:center; font-family:inherit;
  }
  .selbtn small{display:block; font-weight:400; font-size:.72rem; margin-top:3px; color:#666;}
  .selbtn.active{background:var(--army); color:#fff; border-color:var(--army);}
  .selbtn.active small{color:var(--khaki);}
  .go{
    width:100%; margin-top:24px; padding:15px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:1.05rem; font-weight:800;
    letter-spacing:3px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  .go:hover{filter:brightness(1.1);}
  .reviewbtn{
    width:100%; margin-top:10px; padding:13px; border:2px solid var(--bad); border-radius:10px;
    background:#fff; color:var(--bad); font-size:.95rem; font-weight:800;
    letter-spacing:2px; cursor:pointer; font-family:inherit;
  }
  .reviewbtn:disabled{border-color:#bbb; color:#999; cursor:default;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:.85rem; font-weight:700; color:var(--army-dark);}
  .homebtn{
    border:1.5px solid var(--army-light); background:#fff; color:var(--army-dark);
    border-radius:8px; padding:4px 10px; font-size:.75rem; font-weight:700;
    cursor:pointer; font-family:inherit; margin-left:10px;
  }
  .daytag{font-size:.75rem; color:#777; margin-bottom:10px; text-align:center; letter-spacing:1px;}
  .progress{height:8px; background:#ddd8c2; border-radius:4px; overflow:hidden; margin-bottom:20px;}
  .progress i{display:block; height:100%; background:var(--army); transition:width .3s;}
  .prompt{
    background:#fff; border:2px solid var(--army-light); border-radius:12px;
    padding:26px 18px; text-align:center; margin-bottom:18px;
  }
  .prompt .ptype{font-size:.72rem; color:#888; letter-spacing:1px; margin-bottom:8px;}
  .prompt .ptext{font-size:1.3rem; font-weight:800; color:var(--army-dark); line-height:1.45; word-break:keep-all;}
  .choices{display:grid; gap:10px;}
  .choice{
    border:2px solid #cfc9ab; background:#fff; border-radius:10px;
    padding:13px 14px; font-size:.95rem; text-align:left; cursor:pointer;
    font-family:inherit; line-height:1.4; transition:.12s; word-break:keep-all;
  }
  .choice:hover:not(:disabled){border-color:var(--army); background:#f2f4ea;}
  .choice:disabled{cursor:default;}
  .choice .num{display:inline-block; font-weight:800; color:var(--accent); margin-right:8px;}
  .choice.correct{background:#e5f2e6; border-color:var(--ok); color:var(--ok); font-weight:700;}
  .choice.wrong{background:#fdecec; border-color:var(--bad); color:var(--bad);}
  .shortbox{display:flex; gap:8px;}
  .shortbox input{
    flex:1; padding:13px 14px; font-size:1rem; border:2px solid var(--army-light);
    border-radius:10px; font-family:inherit; outline:none; min-width:0;
  }
  .shortbox input:focus{border-color:var(--accent);}
  .shortbox button{
    padding:0 22px; border:none; border-radius:10px; background:var(--army);
    color:#fff; font-weight:700; font-size:.95rem; cursor:pointer; font-family:inherit;
  }
  .feedback{margin-top:14px; text-align:center; font-weight:800; font-size:.98rem; min-height:26px; word-break:keep-all;}
  .feedback.ok{color:var(--ok);}
  .feedback.no{color:var(--bad);}
  .nextbtn{
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:10px;
    background:var(--army-dark); color:var(--khaki); font-size:.95rem; font-weight:700;
    letter-spacing:2px; cursor:pointer; font-family:inherit;
  }
  .score{text-align:center; padding:10px 0 4px;}
  .score .num{font-size:3.4rem; font-weight:900; color:var(--army-dark);}
  .score .num span{font-size:1.3rem; color:#888; font-weight:600;}
  .verdict{
    margin:14px 0 20px; text-align:center; font-size:1.15rem; font-weight:900;
    padding:16px 12px; border-radius:12px; letter-spacing:1px; word-break:keep-all;
  }
  .verdict.v90{background:#e5f2e6; color:var(--ok); border:2px solid var(--ok);}
  .verdict.v80{background:#eef3e2; color:#558b2f; border:2px solid #558b2f;}
  .verdict.v70{background:#fdf3dc; color:#b07d10; border:2px solid #d9a520;}
  .verdict.v0{background:#fdecec; color:var(--bad); border:2px solid var(--bad);}
  .review h3{font-size:.9rem; color:var(--army-dark); margin-bottom:8px; letter-spacing:1px;}
  .rv{
    background:#fff; border:1.5px solid #ddd6b8; border-radius:10px;
    padding:10px 12px; margin-bottom:8px; font-size:.87rem; line-height:1.5;
  }
  .rv b{color:var(--army-dark);}
  .rv .my{color:var(--bad);}
  .rv .ans{color:var(--ok); font-weight:700;}
  .btnrow{display:flex; gap:10px; margin-top:20px;}
  .btnrow button{flex:1; padding:14px; border:none; border-radius:10px; font-weight:800; font-size:.92rem; cursor:pointer; font-family:inherit; letter-spacing:1px;}
  .btn-retry{background:var(--accent); color:#fff;}
  .btn-home{background:var(--army-dark); color:var(--khaki);}
  .daylist{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .daybtn{
    border:2px solid var(--bad); background:#fff; border-radius:10px; padding:12px;
    font-size:.9rem; font-weight:700; color:var(--bad); cursor:pointer; font-family:inherit;
  }
  .daybtn.allbtn{grid-column:1 / -1; background:var(--bad); color:#fff;}
  .emptymsg{
    background:#fff; border:1.5px solid #ddd6b8; border-radius:10px; padding:18px;
    text-align:center; font-size:.92rem; color:#666;
  }
  .hidden{display:none;}
  footer{text-align:center; font-size:.7rem; color:#8b8b76; padding:0 0 18px;}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <header>
    <h1>⭐ 전우 보카 테스트 ⭐</h1>
    <p>2027 심슨 보카 · Day 01–48 · 총 2,400단어</p>
  </header>
  <div class="body">

    <!-- 시작 화면 -->
    <div id="screen-start">
      <div class="label">📅 DAY 선택</div>
      <select class="dayselect" id="daySel"></select>
      <div class="label">📝 유형 선택</div>
      <div class="optgrid" id="typeSel">
        <button class="selbtn active" data-type="e2k">뜻 맞히기<small>영단어 보고 뜻 고르기 · 4지선다</small></button>
        <button class="selbtn" data-type="k2e">단어 맞히기<small>뜻 보고 영단어 고르기 · 4지선다</small></button>
        <button class="selbtn" data-type="write">스펠링 쓰기<small>뜻 보고 영단어 직접 쓰기 · 주관식</small></button>
      </div>
      <div class="label">🔢 단어 수 선택</div>
      <div class="optgrid cols3" id="countSel">
        <button class="selbtn active" data-count="10">10개</button>
        <button class="selbtn" data-count="25">25개</button>
        <button class="selbtn" data-count="all">전체</button>
      </div>
      <button class="go" id="btnStart">🎖️ 테스트 개시</button>
      <button class="reviewbtn" id="btnReview">📋 오답 복습 (0)</button>
    </div>

    <!-- 복습 선택 화면 -->
    <div id="screen-review" class="hidden">
      <div class="topbar">
        <span>📋 오답 복습</span>
        <button class="homebtn" id="btnReviewHome">🏠 메인으로</button>
      </div>
      <div class="daytag">Day를 고르면 틀린 단어만 다시 풀어요. 맞추면 오답에서 지워집니다! (유형은 메인에서 선택한 방식 적용)</div>
      <div class="daylist" id="reviewDays"></div>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="screen-quiz" class="hidden">
      <div class="topbar">
        <span id="qCounter">1 / 10</span>
        <span>정답 <span id="qScore">0</span><button class="homebtn" id="btnQuizHome">🏠 메인으로</button></span>
      </div>
      <div class="daytag" id="qDay"></div>
      <div class="progress"><i id="qBar" style="width:0%"></i></div>
      <div class="prompt">
        <div class="ptype" id="qType"></div>
        <div class="ptext" id="qText"></div>
      </div>
      <div class="choices" id="qChoices"></div>
      <div class="shortbox hidden" id="qShort">
        <input type="text" id="qInput" placeholder="영어 단어(또는 표현)를 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="qSubmit">확인</button>
      </div>
      <div class="feedback" id="qFeed"></div>
      <button class="nextbtn hidden" id="btnNext">다음 문제 ▶</button>
    </div>

    <!-- 결과 화면 -->
    <div id="screen-result" class="hidden">
      <div class="score"><div class="num"><span id="rScore">0</span><span> / 100점</span></div></div>
      <div class="verdict" id="rVerdict"></div>
      <div class="review" id="rReview"></div>
      <div class="btnrow">
        <button class="btn-retry" id="btnRetry">🔄 재응시</button>
        <button class="btn-home" id="btnHome">🏠 메인으로</button>
      </div>
    </div>

  </div>
  <footer>출처: 2027 심슨 보카 DAY별 테스트 (Day 01–48)</footer>
</div>

const TYPE_LABEL = {
  e2k: "영어 단어의 뜻을 고르시오",
  k2e: "한글 뜻에 맞는 영어 단어를 고르시오",
  write: "한글 뜻에 맞는 영어 단어를 쓰시오"
};

let cfg = { day: "1", type: "e2k", count: "10" };
let quiz = [], cur = 0, correct = 0, record = [], answered = false;
let mode = "main";        // "main" | "review"
let reviewKey = null;      // day string or "all"

// ---------- 오답 저장소 (localStorage, 실패 시 메모리) ----------
let _mem = {};
function loadWrong(){
  try{ return JSON.parse(localStorage.getItem("voca_wrong") || "{}"); }
  catch(e){ return _mem; }
}
function saveWrong(d){
  try{ localStorage.setItem("voca_wrong", JSON.stringify(d)); }
  catch(e){ _mem = d; }
}
function addWrong(day, word, meaning){
  const d = loadWrong();
  if(!d[day]) d[day] = {};
  d[day][word] = meaning;
  saveWrong(d);
}
function removeWrong(day, word){
  const d = loadWrong();
  if(d[day]){ delete d[day][word]; if(Object.keys(d[day]).length===0) delete d[day]; }
  saveWrong(d);
}
function wrongCount(){
  const d = loadWrong();
  return Object.values(d).reduce((s,v)=>s+Object.keys(v).length,0);
}

// ---------- 시작 화면 ----------
const daySel = document.getElementById("daySel");
Object.keys(WORDS).map(Number).sort((a,b)=>a-b).forEach(d=>{
  const o = document.createElement("option");
  o.value = d; o.textContent = "Day " + String(d).padStart(2,"0");
  daySel.appendChild(o);
});
const oAll = document.createElement("option");
oAll.value = "all"; oAll.textContent = "전체 (Day 01–48 통합 랜덤)";
daySel.appendChild(oAll);
daySel.addEventListener("change", ()=>{ cfg.day = daySel.value; });

function bindGrid(id, key){
  document.getElementById(id).querySelectorAll(".selbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("#"+id+" .selbtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      cfg[key] = btn.dataset[key];
    });
  });
}
bindGrid("typeSel","type");
bindGrid("countSel","count");

document.getElementById("btnStart").addEventListener("click", ()=>{ mode="main"; startQuiz(); });
document.getElementById("btnRetry").addEventListener("click", ()=>{
  if(mode==="review") startReviewQuiz(reviewKey); else startQuiz();
});
document.getElementById("btnHome").addEventListener("click", goHome);
document.getElementById("btnQuizHome").addEventListener("click", goHome);
document.getElementById("btnReviewHome").addEventListener("click", goHome);
document.getElementById("btnReview").addEventListener("click", openReview);

function goHome(){
  refreshReviewBtn();
  show("screen-start");
}
function refreshReviewBtn(){
  const n = wrongCount();
  const b = document.getElementById("btnReview");
  b.textContent = "📋 오답 복습 (" + n + ")";
}
refreshReviewBtn();

// pool: [word, meaning, day]
function pool(){
  if(cfg.day === "all"){
    let p = [];
    Object.keys(WORDS).forEach(d=>{ WORDS[d].forEach(([w,m])=>p.push([w,m,d])); });
    return p;
  }
  return WORDS[cfg.day].map(([w,m])=>[w,m,cfg.day]);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuiz(items, distractorPool){
  return items.map(([w,m,d])=>{
    const item = { word:w, meaning:m, day:d };
    if(cfg.type !== "write"){
      const others = shuffle(distractorPool.filter(x=>x[0]!==w && x[1]!==m)).slice(0,3);
      const opts = shuffle([[w,m], ...others]);
      item.choices = opts.map(o => cfg.type==="e2k" ? o[1] : o[0]);
      item.answerIdx = opts.findIndex(o=>o[0]===w);
    }
    return item;
  });
}

function startQuiz(){
  const p = pool();
  const n = cfg.count==="all" ? p.length : Math.min(parseInt(cfg.count), p.length);
  quiz = buildQuiz(shuffle(p).slice(0,n), p);
  cur = 0; correct = 0; record = [];
  document.getElementById("qDay").textContent =
    (cfg.day==="all" ? "Day 01–48 통합" : "Day " + String(cfg.day).padStart(2,"0")) + " · " + n + "문제";
  show("screen-quiz");
  renderQ();
}

// ---------- 복습 ----------
function openReview(){
  const d = loadWrong();
  const box = document.getElementById("reviewDays");
  box.innerHTML = "";
  const days = Object.keys(d).map(Number).sort((a,b)=>a-b);
  if(days.length === 0){
    box.innerHTML = '<div class="emptymsg" style="grid-column:1 / -1">저장된 오답이 없습니다.<br>테스트에서 틀린 단어가 자동으로 여기에 모입니다, 전우! 🫡</div>';
  }else{
    const total = wrongCount();
    const ab = document.createElement("button");
    ab.className = "daybtn allbtn";
    ab.textContent = "전체 복습 (" + total + "단어)";
    ab.addEventListener("click", ()=>startReviewQuiz("all"));
    box.appendChild(ab);
    days.forEach(day=>{
      const n = Object.keys(d[day]).length;
      const b = document.createElement("button");
      b.className = "daybtn";
      b.textContent = "Day " + String(day).padStart(2,"0") + " (" + n + ")";
      b.addEventListener("click", ()=>startReviewQuiz(String(day)));
      box.appendChild(b);
    });
  }
  show("screen-review");
}

function startReviewQuiz(key){
  reviewKey = key;
  const d = loadWrong();
  let items = [];
  Object.keys(d).forEach(day=>{
    if(key==="all" || key===day){
      Object.entries(d[day]).forEach(([w,m])=>items.push([w,m,day]));
    }
  });
  if(items.length === 0){ openReview(); return; }
  // 보기 후보: 해당 Day 전체 단어들
  let dp = [];
  const dayset = new Set(items.map(it=>it[2]));
  dayset.forEach(day=>{ (WORDS[day]||[]).forEach(([w,m])=>dp.push([w,m,day])); });
  if(dp.length < 8) dp = pool();
  mode = "review";
  quiz = buildQuiz(shuffle(items), dp);
  cur = 0; correct = 0; record = [];
  document.getElementById("qDay").textContent =
    "📋 오답 복습 · " + (key==="all" ? "전체" : "Day " + String(key).padStart(2,"0")) + " · " + quiz.length + "문제";
  show("screen-quiz");
  renderQ();
}

// ---------- 퀴즈 진행 ----------
function show(id){
  ["screen-start","screen-review","screen-quiz","screen-result"].forEach(s=>{
    document.getElementById(s).classList.toggle("hidden", s!==id);
  });
}

function renderQ(){
  answered = false;
  const q = quiz[cur];
  document.getElementById("qCounter").textContent = (cur+1)+" / "+quiz.length;
  document.getElementById("qScore").textContent = correct;
  document.getElementById("qBar").style.width = (cur/quiz.length*100)+"%";
  document.getElementById("qType").textContent = "Q"+(cur+1)+". "+TYPE_LABEL[cfg.type];
  document.getElementById("qText").textContent = cfg.type==="e2k" ? q.word : q.meaning;
  document.getElementById("qFeed").textContent = "";
  document.getElementById("qFeed").className = "feedback";
  document.getElementById("btnNext").classList.add("hidden");

  const box = document.getElementById("qChoices");
  const shortBox = document.getElementById("qShort");
  box.innerHTML = "";

  if(cfg.type === "write"){
    box.classList.add("hidden");
    shortBox.classList.remove("hidden");
    const inp = document.getElementById("qInput");
    inp.value = ""; inp.disabled = false;
    document.getElementById("qSubmit").disabled = false;
    setTimeout(()=>inp.focus(), 50);
  }else{
    shortBox.classList.add("hidden");
    box.classList.remove("hidden");
    q.choices.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "choice";
      b.innerHTML = '<span class="num">'+(i+1)+'</span>'+escapeHtml(c);
      b.addEventListener("click", ()=>pick(i,b));
      box.appendChild(b);
    });
  }
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function normAns(s){
  return s.toLowerCase().replace(/\s+/g," ").trim();
}

function pick(i, btn){
  if(answered) return;
  answered = true;
  const q = quiz[cur];
  const ok = i === q.answerIdx;
  const btns = document.querySelectorAll("#qChoices .choice");
  btns.forEach(b=>b.disabled = true);
  btns[q.answerIdx].classList.add("correct");
  if(!ok) btn.classList.add("wrong");
  afterAnswer(ok, q.choices[i]);
}

document.getElementById("qSubmit").addEventListener("click", submitWrite);
document.getElementById("qInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") submitWrite();
});

function submitWrite(){
  if(answered) return;
  const inp = document.getElementById("qInput");
  const val = inp.value.trim();
  if(!val){ inp.focus(); return; }
  answered = true;
  inp.disabled = true;
  document.getElementById("qSubmit").disabled = true;
  const q = quiz[cur];
  const ok = normAns(val) === normAns(q.word);
  afterAnswer(ok, val);
}

function afterAnswer(ok, myAns){
  const q = quiz[cur];
  if(ok) correct++;
  record.push({ q, myAns, ok });
  // 오답 저장/삭제
  if(mode === "main"){
    if(!ok) addWrong(q.day, q.word, q.meaning);
  }else{
    if(ok) removeWrong(q.day, q.word);
  }
  const feed = document.getElementById("qFeed");
  feed.textContent = ok
    ? (mode==="review" ? "⭕ 정답! 오답 목록에서 삭제!" : "⭕ 정답!")
    : "❌ 오답! 정답: "+q.word+" — "+q.meaning;
  feed.classList.add(ok ? "ok" : "no");
  document.getElementById("qScore").textContent = correct;
  const nb = document.getElementById("btnNext");
  nb.textContent = cur === quiz.length-1 ? "결과 확인 ▶" : "다음 문제 ▶";
  nb.classList.remove("hidden");
  nb.focus();
}

document.getElementById("btnNext").addEventListener("click", ()=>{
  cur++;
  if(cur >= quiz.length) showResult();
  else renderQ();
});

// ---------- 결과 ----------
function showResult(){
  const score = Math.round(correct / quiz.length * 100);
  document.getElementById("rScore").textContent = score;
  const v = document.getElementById("rVerdict");
  if(mode === "review"){
    const remain = wrongCount();
    v.textContent = "복습 완료! " + correct + "/" + quiz.length + " 정답 · 남은 오답 " + remain + "개";
    v.className = "verdict " + (score >= 90 ? "v90" : score >= 70 ? "v70" : "v0");
  }else if(score >= 90){ v.textContent = "🎖️ 전우! 이미 합격입니다"; v.className = "verdict v90"; }
  else if(score >= 80){ v.textContent = "💪 전우! 잘하면 합격입니다"; v.className = "verdict v80"; }
  else if(score >= 70){ v.textContent = "🍀 전우! 운좋으면 합격입니다"; v.className = "verdict v70"; }
  else { v.textContent = "🥔 전우! 깡이나 추러 가시죠"; v.className = "verdict v0"; }

  const rv = document.getElementById("rReview");
  const wrongs = record.filter(r=>!r.ok);
  if(wrongs.length === 0){
    rv.innerHTML = '<h3>📋 오답 노트</h3><div class="rv">전 문항 정답! 완벽합니다, 전우! 🫡</div>';
  }else{
    const note = mode==="main" ? ' <span style="font-weight:400;color:#888">(복습 코너에 저장됨)</span>' : '';
    rv.innerHTML = '<h3>📋 오답 노트 ('+wrongs.length+'개)'+note+'</h3>' + wrongs.map(r=>{
      const my = r.myAns ? escapeHtml(String(r.myAns)) : "(무응답)";
      return '<div class="rv"><b>'+escapeHtml(r.q.word)+'</b> — '+escapeHtml(r.q.meaning)+
             '<br>내 답: <span class="my">'+my+'</span> → 정답: <span class="ans">'+escapeHtml(cfg.type==="e2k" ? r.q.meaning : r.q.word)+'</span></div>';
    }).join("");
  }
  show("screen-result");
}
</script>
</body>
